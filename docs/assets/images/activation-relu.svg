<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="title desc">
  <title id="title">Grafik fungsi aktivasi ReLU</title>
  <desc id="desc">ReLU bernilai nol untuk masukan negatif dan mengikuti garis y sama dengan z untuk masukan positif.</desc>
  <rect width="720" height="390" rx="18" fill="#eff6ff"/>
  <text x="36" y="42" fill="#12345a" font-family="Arial,sans-serif" font-size="22" font-weight="700">ReLU(z) = max(0, z)</text>
  <g stroke="#c9d8e8" stroke-width="1"><path d="M100 75H660M100 123H660M100 171H660M100 219H660M100 267H660M100 315H660"/><path d="M100 75V315M170 75V315M240 75V315M310 75V315M380 75V315M450 75V315M520 75V315M590 75V315M660 75V315"/></g>
  <path d="M100 267H660M380 315V75" stroke="#334e68" stroke-width="2.5"/>
  <path d="M100 267H380L660 75" fill="none" stroke="#0878c9" stroke-width="5" stroke-linejoin="round"/>
  <text x="368" y="345" fill="#334e68" font-family="Arial,sans-serif" font-size="16">z</text>
  <text x="35" y="84" fill="#334e68" font-family="Arial,sans-serif" font-size="14">4</text><text x="35" y="271" fill="#334e68" font-family="Arial,sans-serif" font-size="14">0</text>
  <text x="98" y="340" fill="#334e68" font-family="Arial,sans-serif" font-size="14">−4</text><text x="374" y="340" fill="#334e68" font-family="Arial,sans-serif" font-size="14">0</text><text x="648" y="340" fill="#334e68" font-family="Arial,sans-serif" font-size="14">4</text>
  <text x="117" y="246" fill="#526d88" font-family="Arial,sans-serif" font-size="14">z ≤ 0: output 0</text><text x="475" y="157" fill="#0878c9" font-family="Arial,sans-serif" font-size="14" font-weight="700">z &gt; 0: output z</text>
</svg>
