<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="title desc">
  <title id="title">Grafik fungsi aktivasi tanh</title>
  <desc id="desc">Kurva tanh berbentuk S dengan keluaran antara minus satu dan satu serta nilai nol saat masukannya nol.</desc>
  <rect width="720" height="390" rx="18" fill="#eff6ff"/>
  <text x="36" y="42" fill="#12345a" font-family="Arial,sans-serif" font-size="22" font-weight="700">tanh(z)</text>
  <g stroke="#c9d8e8" stroke-width="1"><path d="M100 75H660M100 135H660M100 195H660M100 255H660M100 315H660"/><path d="M100 75V315M170 75V315M240 75V315M310 75V315M380 75V315M450 75V315M520 75V315M590 75V315M660 75V315"/></g>
  <path d="M100 315H660M380 315V75" stroke="#334e68" stroke-width="2.5"/>
  <path d="M100 315 C190 315 240 312 280 299 C325 283 346 245 380 195 C414 145 435 107 480 91 C520 78 570 75 660 75" fill="none" stroke="#0878c9" stroke-width="5" stroke-linecap="round"/>
  <circle cx="380" cy="195" r="6" fill="#e45454" stroke="#fff" stroke-width="2"/>
  <text x="368" y="345" fill="#334e68" font-family="Arial,sans-serif" font-size="16">z</text>
  <text x="45" y="80" fill="#334e68" font-family="Arial,sans-serif" font-size="14">1</text><text x="45" y="200" fill="#334e68" font-family="Arial,sans-serif" font-size="14">0</text><text x="45" y="320" fill="#334e68" font-family="Arial,sans-serif" font-size="14">−1</text>
  <text x="98" y="340" fill="#334e68" font-family="Arial,sans-serif" font-size="14">−4</text><text x="374" y="340" fill="#334e68" font-family="Arial,sans-serif" font-size="14">0</text><text x="648" y="340" fill="#334e68" font-family="Arial,sans-serif" font-size="14">4</text>
  <text x="402" y="182" fill="#526d88" font-family="Arial,sans-serif" font-size="14">tanh(0) = 0</text>
</svg>
