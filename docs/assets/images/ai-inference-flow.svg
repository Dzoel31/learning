<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Alur inference dengan tiga jenis input</title>
  <desc id="desc">Data sensor masuk ke model regresi atau klasifikasi dan menghasilkan nilai atau status. Foto masuk ke model visi dan menghasilkan kelas. Prompt bersama context masuk ke LLM dan menghasilkan teks.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52718e"/></marker></defs>
  <rect width="960" height="470" rx="18" fill="#eff6ff"/>
  <text x="34" y="42" fill="#12345a" font-family="Arial,sans-serif" font-size="22" font-weight="700">Inference: input baru melewati model yang sudah dilatih</text>
  <g fill="#334e68" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle"><text x="175" y="90">INPUT</text><text x="480" y="90">MODEL</text><text x="785" y="90">OUTPUT</text></g>
  <g stroke="#52718e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M300 157H365"/><path d="M595 157H660"/><path d="M300 267H365"/><path d="M595 267H660"/><path d="M300 377H365"/><path d="M595 377H660"/></g>
  <g fill="#fff" stroke="#4b83b7" stroke-width="2.5"><rect x="50" y="119" width="250" height="76" rx="14"/><rect x="50" y="229" width="250" height="76" rx="14"/><rect x="50" y="339" width="250" height="76" rx="14"/></g>
  <g fill="#e6f4ff" stroke="#0878c9" stroke-width="2.5"><rect x="365" y="119" width="230" height="76" rx="14"/><rect x="365" y="229" width="230" height="76" rx="14"/></g>
  <rect x="365" y="339" width="230" height="76" rx="14" fill="#f0eaff" stroke="#7755b7" stroke-width="2.5"/>
  <g fill="#dcf3e8" stroke="#29966b" stroke-width="2.5"><rect x="660" y="119" width="250" height="76" rx="14"/><rect x="660" y="229" width="250" height="76" rx="14"/><rect x="660" y="339" width="250" height="76" rx="14"/></g>
  <g fill="#12345a" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle"><text x="175" y="151">Fitur sensor</text><text x="175" y="175" font-size="14" font-weight="400">suhu · kelembapan · pH</text><text x="175" y="261">Foto daun</text><text x="175" y="285" font-size="14" font-weight="400">gambar RGB</text><text x="175" y="371">Prompt + context</text><text x="175" y="395" font-size="14" font-weight="400">instruksi dan informasi</text>
    <text x="480" y="151">Regresi / klasifikasi</text><text x="480" y="175" font-size="14" font-weight="400">model numerik</text><text x="480" y="261">Model vision</text><text x="480" y="285" font-size="14" font-weight="400">classifier gambar</text><text x="480" y="371">LLM</text><text x="480" y="395" font-size="14" font-weight="400">model bahasa</text>
    <text x="785" y="151">Nilai atau status</text><text x="785" y="175" font-size="14" font-weight="400">prediksi suhu · kondisi</text><text x="785" y="261">Kelas objek</text><text x="785" y="285" font-size="14" font-weight="400">sehat · kering · rusak</text><text x="785" y="371">Teks</text><text x="785" y="395" font-size="14" font-weight="400">jawaban berdasarkan input</text></g>
  <text x="34" y="447" fill="#526d88" font-family="Arial,sans-serif" font-size="14">Jenis model dan format output mengikuti tugas; model tidak dilatih ulang setiap kali menerima input.</text>
</svg>
