<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Model sequence memproses input per langkah waktu</title>
  <desc id="desc">Tiga pembacaan sensor masuk berurutan ke sel recurrent dengan bobot yang sama. Hidden state diteruskan pada setiap langkah. LSTM juga meneruskan cell state, sedangkan state terakhir menghasilkan prediksi.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#52718e"/>
    </marker>
  </defs>
  <rect width="960" height="390" rx="18" fill="#eff6ff"/>
  <text x="32" y="42" fill="#12345a" font-family="Arial,sans-serif" font-size="22" font-weight="700">Model sequence membaca urutan selangkah demi selangkah</text>
  <rect x="258" y="63" width="414" height="38" rx="19" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="465" y="88" text-anchor="middle" fill="#1e3a5f" font-family="Arial,sans-serif" font-size="15" font-weight="700">Bobot yang sama dipakai ulang pada setiap waktu</text>

  <text x="40" y="132" fill="#52677f" font-family="Arial,sans-serif" font-size="13" font-weight="700">INPUT SENSOR</text>
  <g fill="#fff" stroke="#60a5fa" stroke-width="2">
    <rect x="44" y="146" width="160" height="52" rx="10"/>
    <rect x="274" y="146" width="160" height="52" rx="10"/>
    <rect x="504" y="146" width="160" height="52" rx="10"/>
  </g>
  <g fill="#12345a" font-family="Arial,sans-serif" text-anchor="middle">
    <text x="124" y="169" font-size="16" font-weight="700">xₜ₋₂</text>
    <text x="124" y="188" font-size="12">t − 2</text>
    <text x="354" y="169" font-size="16" font-weight="700">xₜ₋₁</text>
    <text x="354" y="188" font-size="12">t − 1</text>
    <text x="584" y="169" font-size="16" font-weight="700">xₜ</text>
    <text x="584" y="188" font-size="12">t</text>
  </g>

  <g fill="none" stroke="#52718e" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M124 198V231"/>
    <path d="M354 198V231"/>
    <path d="M584 198V231"/>
    <path d="M204 271H260"/>
    <path d="M434 271H490"/>
    <path d="M664 271H748"/>
  </g>

  <g fill="#fff" stroke="#2563a5" stroke-width="2">
    <rect x="44" y="232" width="160" height="78" rx="12"/>
    <rect x="274" y="232" width="160" height="78" rx="12"/>
    <rect x="504" y="232" width="160" height="78" rx="12"/>
  </g>
  <g fill="#12345a" font-family="Arial,sans-serif" text-anchor="middle">
    <text x="124" y="262" font-size="15" font-weight="700">RNN / LSTM / GRU</text>
    <text x="124" y="285" font-size="13">state: hₜ₋₂</text>
    <text x="354" y="262" font-size="15" font-weight="700">RNN / LSTM / GRU</text>
    <text x="354" y="285" font-size="13">state: hₜ₋₁</text>
    <text x="584" y="262" font-size="15" font-weight="700">RNN / LSTM / GRU</text>
    <text x="584" y="285" font-size="13">state: hₜ</text>
  </g>

  <rect x="750" y="232" width="166" height="78" rx="12" fill="#dcfce7" stroke="#22a06b" stroke-width="2"/>
  <text x="833" y="263" text-anchor="middle" fill="#14532d" font-family="Arial,sans-serif" font-size="14" font-weight="700">PREDIKSI</text>
  <text x="833" y="287" text-anchor="middle" fill="#14532d" font-family="Arial,sans-serif" font-size="15">ŷₜ₊₁</text>

  <text x="124" y="340" text-anchor="middle" fill="#52677f" font-family="Arial,sans-serif" font-size="12">input baru</text>
  <text x="354" y="340" text-anchor="middle" fill="#52677f" font-family="Arial,sans-serif" font-size="12">state membawa ringkasan</text>
  <text x="584" y="340" text-anchor="middle" fill="#52677f" font-family="Arial,sans-serif" font-size="12">state terbaru</text>
  <text x="833" y="340" text-anchor="middle" fill="#52677f" font-family="Arial,sans-serif" font-size="12">nilai waktu berikutnya</text>
  <text x="480" y="374" text-anchor="middle" fill="#52677f" font-family="Arial,sans-serif" font-size="12">Pada LSTM, cell state cₜ ikut diteruskan bersama hidden state hₜ.</text>
</svg>
