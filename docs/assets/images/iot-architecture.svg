<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Arsitektur dasar sistem IoT</title>
  <desc id="desc">Device mengirim pembacaan ke backend. Backend mengirim perintah ke device, menyimpan atau membaca database, serta menerima request dan mengirim respons ke dashboard.</desc>
