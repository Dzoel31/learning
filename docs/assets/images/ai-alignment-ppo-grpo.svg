<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc">
  <title id="title">Perbandingan alur PPO dan GRPO untuk alignment model</title>
  <desc id="desc">Prompt dikirim ke policy untuk menghasilkan satu kelompok respons. Cabang PPO menilai respons dengan reward model, membandingkan policy dengan reference model, menghitung advantage dengan critic, lalu memperbarui policy menggunakan clipped objective. Cabang GRPO menilai respons dalam kelompok, menormalkan reward relatif sebagai advantage tanpa critic terpisah, lalu memperbarui policy.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1100" height="570" rx="20" fill="#f1f5f9"/>
  <text x="34" y="43" fill="#12345a" font-family="Arial,sans-serif" font-size="24" font-weight="700">Alignment: PPO dan GRPO</text>
  <text x="34" y="70" fill="#52677f" font-family="Arial,sans-serif" font-size="14">Keduanya memperbarui policy dari reward; cara menghitung advantage berbeda.</text>

  <rect x="38" y="100" width="150" height="66" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <text x="113" y="128" text-anchor="middle" fill="#12345a" font-family="Arial,sans-serif" font-size="15" font-weight="700">Prompt</text>
  <text x="113" y="148" text-anchor="middle" fill="#52677f" font-family="Arial,sans-serif" font-size="12">satu pertanyaan</text>
  <path d="M188 133H235" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="244" y="100" width="210" height="66" rx="12" fill="#dbeafe" stroke="#2563a5" stroke-width="2"/>
  <text x="349" y="128" text-anchor="middle" fill="#12345a" font-family="Arial,sans-serif" font-size="15" font-weight="700">Policy model</text>
  <text x="349" y="148" text-anchor="middle" fill="#1e3a5f" font-family="Arial,sans-serif" font-size="12">menghasilkan beberapa respons</text>
  <path d="M454 133H501" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="510" y="100" width="220" height="66" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <text x="620" y="128" text-anchor="middle" fill="#12345a" font-family="Arial,sans-serif" font-size="15" font-weight="700">Kelompok respons</text>
  <text x="620" y="148" text-anchor="middle" fill="#52677f" font-family="Arial,sans-serif" font-size="12">y₁, y₂, …, yG</text>

  <rect x="34" y="200" width="1032" height="142" rx="16" fill="#fff" stroke="#2563a5" stroke-width="2"/>
  <rect x="34" y="200" width="106" height="142" rx="16" fill="#dbeafe"/>
  <text x="87" y="264" text-anchor="middle" fill="#12345a" font-family="Arial,sans-serif" font-size="20" font-weight="700">PPO</text>
  <text x="87" y="288" text-anchor="middle" fill="#1e3a5f" font-family="Arial,sans-serif" font-size="12">critic</text>
  <rect x="154" y="230" width="177" height="82" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="242" y="262" text-anchor="middle" fill="#12345a" font-family="Arial,sans-serif" font-size="14" font-weight="700">Reward model</text>
  <text x="242" y="284" text-anchor="middle" fill="#52677f" font-family="Arial,sans-serif" font-size="12">memberi skor respons</text>
  <rect x="354" y="230" width="190" height="82" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="449" y="262" text-anchor="middle" fill="#12345a" font-family="Arial,sans-serif" font-size="14" font-weight="700">Reference policy</text>
  <text x="449" y="284" text-anchor="middle" fill="#52677f" font-family="Arial,sans-serif" font-size="12">ukur perubahan / KL</text>
  <rect x="567" y="230" width="190" height="82" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="662" y="262" text-anchor="middle" fill="#12345a" font-family="Arial,sans-serif" font-size="14" font-weight="700">Critic</text>
  <text x="662" y="284" text-anchor="middle" fill="#52677f" font-family="Arial,sans-serif" font-size="12">estimasi value / advantage</text>
  <path d="M757 271H802" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="811" y="230" width="226" height="82" rx="12" fill="#dcfce7" stroke="#22a06b" stroke-width="2"/>
  <text x="924" y="261" text-anchor="middle" fill="#14532d" font-family="Arial,sans-serif" font-size="14" font-weight="700">Update policy</text>
  <text x="924" y="284" text-anchor="middle" fill="#14532d" font-family="Arial,sans-serif" font-size="12">clipped objective PPO</text>
  <path d="M331 271H354" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M544 271H567" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="34" y="378" width="1032" height="142" rx="16" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="34" y="378" width="106" height="142" rx="16" fill="#ede9fe"/>
  <text x="87" y="442" text-anchor="middle" fill="#4c1d95" font-family="Arial,sans-serif" font-size="20" font-weight="700">GRPO</text>
  <text x="87" y="466" text-anchor="middle" fill="#5b21b6" font-family="Arial,sans-serif" font-size="12">tanpa critic</text>
  <rect x="154" y="408" width="206" height="82" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="257" y="440" text-anchor="middle" fill="#4c1d95" font-family="Arial,sans-serif" font-size="14" font-weight="700">Skor tiap respons</text>
  <text x="257" y="462" text-anchor="middle" fill="#5b21b6" font-family="Arial,sans-serif" font-size="12">reward model / verifier</text>
  <rect x="383" y="408" width="286" height="82" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="526" y="440" text-anchor="middle" fill="#4c1d95" font-family="Arial,sans-serif" font-size="14" font-weight="700">Bandingkan dalam kelompok</text>
  <text x="526" y="462" text-anchor="middle" fill="#5b21b6" font-family="Arial,sans-serif" font-size="12">normalisasi reward → advantage relatif</text>
  <path d="M360 449H383" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M669 449H714" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="723" y="408" width="314" height="82" rx="12" fill="#dcfce7" stroke="#22a06b" stroke-width="2"/>
  <text x="880" y="440" text-anchor="middle" fill="#14532d" font-family="Arial,sans-serif" font-size="14" font-weight="700">Update policy</text>
  <text x="880" y="462" text-anchor="middle" fill="#14532d" font-family="Arial,sans-serif" font-size="12">objective GRPO + penalti KL opsional</text>

  <!-- Branches are drawn above panel backgrounds, with routes clear of cards. -->
  <path d="M730 133H760V190H242V226" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M730 133H1082V390H257V404" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="550" y="548" text-anchor="middle" fill="#52677f" font-family="Arial,sans-serif" font-size="12">PPO dan GRPO tetap memerlukan rancangan reward serta evaluasi hasil; diagram ini menunjukkan alur umum.</text>
</svg>
