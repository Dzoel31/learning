<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Alur CNN untuk klasifikasi gambar</title>
  <desc id="desc">CNN menerapkan filter pada gambar untuk menghasilkan feature map, merangkum ukuran dengan pooling, lalu menggunakan dense layer untuk menentukan kelas.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52718e"/></marker></defs>
  <rect width="960" height="420" rx="18" fill="#eff6ff"/>
  <text x="34" y="42" fill="#12345a" font-family="Arial,sans-serif" font-size="22" font-weight="700">CNN: filter mencari pola lokal pada gambar</text>
  <g fill="#334e68" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle"><text x="115" y="90">Gambar</text><text x="325" y="90">Filter 3 × 3</text><text x="520" y="90">Feature map</text><text x="690" y="90">Pooling</text><text x="850" y="90">Kelas</text></g>
  <g stroke="#fff" stroke-width="3">
    <rect x="55" y="120" width="36" height="36" fill="#d5e7f7"/><rect x="91" y="120" width="36" height="36" fill="#a8c9e5"/><rect x="127" y="120" width="36" height="36" fill="#82afd5"/><rect x="163" y="120" width="36" height="36" fill="#c6dff2"/>
    <rect x="55" y="156" width="36" height="36" fill="#bad5eb"/><rect x="91" y="156" width="36" height="36" fill="#4689c2"/><rect x="127" y="156" width="36" height="36" fill="#286da8"/><rect x="163" y="156" width="36" height="36" fill="#a6c9e4"/>
    <rect x="55" y="192" width="36" height="36" fill="#d5e7f7"/><rect x="91" y="192" width="36" height="36" fill="#4080b8"/><rect x="127" y="192" width="36" height="36" fill="#1f5e98"/><rect x="163" y="192" width="36" height="36" fill="#9fc3e0"/>
    <rect x="55" y="228" width="36" height="36" fill="#e1edf7"/><rect x="91" y="228" width="36" height="36" fill="#bfd8ed"/><rect x="127" y="228" width="36" height="36" fill="#a6c9e4"/><rect x="163" y="228" width="36" height="36" fill="#d5e7f7"/>
  </g>
  <rect x="91" y="156" width="108" height="108" fill="none" stroke="#e28a13" stroke-width="4"/>
  <g fill="#fff0d7" stroke="#e28a13" stroke-width="2"><rect x="260" y="140" width="36" height="36"/><rect x="296" y="140" width="36" height="36"/><rect x="332" y="140" width="36" height="36"/><rect x="260" y="176" width="36" height="36"/><rect x="296" y="176" width="36" height="36"/><rect x="332" y="176" width="36" height="36"/><rect x="260" y="212" width="36" height="36"/><rect x="296" y="212" width="36" height="36"/><rect x="332" y="212" width="36" height="36"/></g>
  <g fill="#7c4a00" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle"><text x="278" y="163">w₁</text><text x="314" y="163">w₂</text><text x="350" y="163">w₃</text><text x="278" y="199">w₄</text><text x="314" y="199">w₅</text><text x="350" y="199">w₆</text><text x="278" y="235">w₇</text><text x="314" y="235">w₈</text><text x="350" y="235">w₉</text></g>
  <g fill="#d5e7f7" stroke="#0878c9" stroke-width="2"><rect x="455" y="148" width="40" height="40"/><rect x="495" y="148" width="40" height="40"/><rect x="535" y="148" width="40" height="40"/><rect x="455" y="188" width="40" height="40"/><rect x="495" y="188" width="40" height="40"/><rect x="535" y="188" width="40" height="40"/><rect x="455" y="228" width="40" height="40"/><rect x="495" y="228" width="40" height="40"/><rect x="535" y="228" width="40" height="40"/></g>
  <g fill="#0878c9"><rect x="455" y="148" width="40" height="40" opacity=".6"/><rect x="535" y="188" width="40" height="40" opacity=".35"/><rect x="495" y="228" width="40" height="40" opacity=".75"/></g>
  <g fill="#fff0d7" stroke="#e28a13" stroke-width="2"><rect x="650" y="165" width="55" height="55"/><rect x="705" y="165" width="55" height="55"/><rect x="650" y="220" width="55" height="55"/><rect x="705" y="220" width="55" height="55"/></g>
  <g fill="#7c4a00" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle"><text x="677" y="199">max</text><text x="732" y="199">max</text><text x="677" y="254">max</text><text x="732" y="254">max</text></g>
  <g fill="#dcf3e8" stroke="#29966b" stroke-width="2"><rect x="825" y="145" width="100" height="35" rx="10"/><rect x="825" y="195" width="100" height="35" rx="10"/><rect x="825" y="245" width="100" height="35" rx="10"/></g>
  <g fill="#176244" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle"><text x="875" y="168">Daun sehat</text><text x="875" y="218">Kering</text><text x="875" y="268">Rusak</text></g>
  <g stroke="#52718e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M205 195H245"/><path d="M380 195H440"/><path d="M580 195H635"/><path d="M765 195H810"/></g>
  <text x="55" y="320" fill="#526d88" font-family="Arial,sans-serif" font-size="14">Bagian gambar yang dibaca filter</text><text x="259" y="320" fill="#526d88" font-family="Arial,sans-serif" font-size="14">Bobot kernel</text><text x="455" y="320" fill="#526d88" font-family="Arial,sans-serif" font-size="14">Respons fitur lokal</text>
  <text x="34" y="370" fill="#526d88" font-family="Arial,sans-serif" font-size="14">Diagram menyederhanakan satu jalur CNN; model nyata dapat menumpuk convolution, aktivasi, dan pooling beberapa kali.</text>
</svg>
